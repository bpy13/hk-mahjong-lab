[workspace]
resolver = "2"
members = ["crates/tiles", "crates/games", "crates/hk", "crates/analysis", "crates/search", "crates/pybind", "crates/app-api"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
mahjong-tiles = { path = "crates/tiles" }
mahjong-games = { path = "crates/games" }
mahjong-hk = { path = "crates/hk" }
mahjong-analysis = { path = "crates/analysis" }
mahjong-search = { path = "crates/search" }
rand = { version = "0.8", features = ["small_rng"] }
# The same random stream on wasm32 and 64-bit (SmallRng differs; hk-games D28).
rand_chacha = "0.3"
proptest = "1.5"
rayon = "1.10"
criterion = { version = "0.5", default-features = false }
# Instant that also works in the browser (performance.now()); std::time::Instant panics in wasm32.
web-time = "1"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1  # keep symbols so profilers show function names
